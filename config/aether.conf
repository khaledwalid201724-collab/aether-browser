# Aether launch settings — edit this file, then restart the browser.
# You can also change theme, start page, search engine and ambience from
# Aether Settings (Alt+Shift+S); those choices take priority on next launch.
# Values: theme = aurora | midnight | emerald | rose | graphite | paper
#         startpage = modern | classic
#         ads / vertical_tabs / canvas / spotlight / controls = on | off
#         no_sandbox = auto | on | off

theme=aurora
startpage=modern
ads=on
vertical_tabs=on
canvas=on
spotlight=on
controls=on
no_sandbox=auto
