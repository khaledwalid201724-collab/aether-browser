<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aether Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><img src="icon.png" alt=""><h1>Quick actions</h1></header>
  <button data-command="new-tab"><span>New tab</span><kbd>Alt+Shift+N</kbd></button>
  <button data-command="incognito"><span>Incognito window</span><kbd>Alt+Shift+I</kbd></button>
  <button data-command="open-home"><span>Aether home</span><kbd>Alt+Shift+H</kbd></button>
  <button data-command="open-settings"><span>Aether Settings</span><kbd>Alt+Shift+S</kbd></button>
  <button data-action="store"><span>Aether Store</span><kbd>Alt+Shift+E</kbd></button>
  <p class="hint">Change shortcuts in <code>extensions/aether-controls/manifest.json</code></p>
  <script src="popup.js"></script>
</body>
</html>
